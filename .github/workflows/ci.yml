name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: |
          npm run typecheck
          npm run typecheck:scripts

      # Unit tests mock the DB and external services; src/test/setupEnv.ts
      # supplies placeholder config.
      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build:registry-client && npm run build

  postgres-integration:
    name: Postgres integration
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: synapse
          POSTGRES_PASSWORD: synapse
          POSTGRES_DB: synapsvault
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        env:
          DATABASE_URL: postgres://synapse:synapse@127.0.0.1:5432/synapsvault
        run: npm run db:migrate

      - name: Verify migrated schema matches declarations
        env:
          DATABASE_URL: postgres://synapse:synapse@127.0.0.1:5432/synapsvault
        run: npm run db:check-schema

      - name: Postgres integration tests
        env:
          DATABASE_URL: postgres://synapse:synapse@127.0.0.1:5432/synapsvault
        run: npm run test:integration

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: synapse
          POSTGRES_PASSWORD: synapse
          POSTGRES_DB: synapsvault
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build image
        env:
          GIT_COMMIT: ${{ steps.meta.outputs.commit }}
          APP_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker build \
            --label org.opencontainers.image.revision="$GIT_COMMIT" \
            --label org.opencontainers.image.version="$APP_VERSION" \
            --build-arg GIT_COMMIT="$GIT_COMMIT" \
            --build-arg APP_VERSION="$APP_VERSION" \
            -t synapsvault-backend:ci .

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate dependency SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm --output-file sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ steps.meta.outputs.commit }}
          path: sbom.cdx.json
          if-no-files-found: error

      - name: Apply migrations
        env:
          DATABASE_URL: postgres://synapse:synapse@127.0.0.1:5432/synapsvault
        run: npm run db:migrate

      # Upgrade test: seed representative prior-version data, then re-run
      # migrations to prove the upgrade preserves rows and indexes.
      # Fixtures live in drizzle/upgrade-fixtures/ and are required for any
      # migration that is not backward compatible (see drizzle/UPGRADES.md).
      - name: Upgrade from previous released schema
        env:
          DATABASE_URL: postgres://synapse:synapse@127.0.0.1:5432/synapsvault
        run: |
          if [ -d drizzle/upgrade-fixtures ]; then
            for fixture in drizzle/upgrade-fixtures/*.sql; do
              [ -e "$fixture" ] || continue
              echo "Seeding prior-version data from $fixture"
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$fixture"
            done
          else
            echo "No upgrade fixtures found; skipping prior-version seed"
          fi
          echo "Re-running migrations to exercise the upgrade path"
          npm run db:migrate
          if [ -d drizzle/upgrade-fixtures ]; then
            for verify in drizzle/upgrade-fixtures/*.verify.sql; do
              [ -e "$verify" ] || continue
              echo "Verifying data and indexes with $verify"
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$verify"
            done
          fi

      - name: Start container
        run: |
          # Throwaway, unfunded keypair generated per run.
          SECRET=$(docker run --rm synapsvault-backend:ci node -e \
            "console.log(require('@stellar/stellar-sdk').Keypair.random().secret())")
          docker run -d --name api --network host \
            -e DATABASE_URL=postgres://synapse:synapse@127.0.0.1:5432/synapsvault \
            -e PAY_TO=GDEJJLXV2CNHF5HEGX34MU4G6L4PRVUAGD4ANF77ZDYTQJKSDSDYVVI6 \
            -e AGENT_SECRET_KEY="$SECRET" \
            -e REGISTRY_SECRET_KEY="$SECRET" \
            -e VAULT_REGISTRY_CONTRACT_ID=CBQEIMSRPSRKJJHGOELZTP3CISZVHZ6WPKZTWJMYZXHFXPGHHWFQBD4H \
            -e REGISTRY_CONTRACT_ID=CBQEIMSRPSRKJJHGOELZTP3CISZVHZ6WPKZTWJMYZXHFXPGHHWFQBD4H \
            -e OPENROUTER_API_KEY=ci-placeholder \
            -e SUPABASE_URL=https://placeholder.supabase.co \
            -e SUPABASE_SERVICE_KEY=ci-placeholder \
            -e ADMIN_API_KEY=ci-admin-key \
            -e BASE_URL=http://127.0.0.1:3000 \
            -e WEB_APP_URL=http://127.0.0.1:5173 \
            -e SIGNING_SECRET_KEY="$SECRET" \
            -e WORKERS_ENABLED=false \
            synapsvault-backend:ci

      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/health
          curl -fsS http://127.0.0.1:3000/openapi.json > /dev/null
          curl -fsS "http://127.0.0.1:3000/resources?limit=1"
          curl -fsS http://127.0.0.1:3000/admin/stats -H "X-Admin-Key: ci-admin-key"
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/publishers/me)
          test "$code" = "401"

      - name: Container logs
        if: always()
        run: docker logs api || true
